name: Deploy registry to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build registry
        run: bunx --bun shadcn@latest build
      - name: Install example dependencies
        run: bun install
        working-directory: example
      - name: Build docs site
        run: bun run build
        working-directory: example
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r public/. _site/
          cp -r example/dist/. _site/
          cp _site/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
